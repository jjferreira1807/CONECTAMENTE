<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-label="Conectamente">
  <title>Conectamente</title>
  <defs>
    <linearGradient id="cm-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6EC8AF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6EC8AF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Logomark (matches /logo.svg) -->
  <g>
    <circle cx="32" cy="34" r="22" fill="none" stroke="#6EC8AF" stroke-opacity="0.4" stroke-width="1.4"/>
    <g stroke="url(#cm-line)" stroke-width="1" stroke-linecap="round" fill="none">
      <line x1="32" y1="34" x2="32" y2="14"/>
      <line x1="32" y1="34" x2="50" y2="24"/>
      <line x1="32" y1="34" x2="50" y2="44"/>
      <line x1="32" y1="34" x2="32" y2="54"/>
      <line x1="32" y1="34" x2="14" y2="34"/>
      <line x1="32" y1="14" x2="50" y2="24"/>
      <line x1="50" y1="24" x2="50" y2="44"/>
      <line x1="50" y1="44" x2="32" y2="54"/>
      <line x1="32" y1="54" x2="14" y2="34"/>
      <line x1="14" y1="34" x2="32" y2="14"/>
    </g>
    <g fill="#6EC8AF">
      <circle cx="32" cy="14" r="2.2"/>
      <circle cx="50" cy="24" r="2.2"/>
      <circle cx="50" cy="44" r="2.2"/>
      <circle cx="32" cy="54" r="2.2"/>
      <circle cx="14" cy="34" r="2.2"/>
    </g>
    <circle cx="32" cy="34" r="3" fill="#6EC8AF"/>
    <circle cx="48" cy="50" r="3.5" fill="#E2B87A" opacity="0.95"/>
  </g>

  <!-- Wordmark · Lora-style serif. Uses generic serif stack so any consumer
       renders something tasteful even without Lora available locally. -->
  <text
    x="76" y="42"
    font-family="Lora, 'Times New Roman', Georgia, serif"
    font-size="28"
    font-weight="500"
    letter-spacing="-0.5"
    fill="#16202A"
  >Conectamente</text>
</svg>
